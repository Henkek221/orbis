<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Orbis splat check</title>
<style>html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;font:13px -apple-system,sans-serif;color:#fff}#log{position:fixed;left:12px;top:10px;opacity:.8;z-index:9}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/","@mkkellogg/gaussian-splats-3d":"./node_modules/@mkkellogg/gaussian-splats-3d/build/gaussian-splats-3d.module.js"}}</script>
</head>
<body>
<div id="log">loading splats…</div>
<script type="module">
import * as GS from "@mkkellogg/gaussian-splats-3d";
const p = new URLSearchParams(location.search);
const cam = (p.get("cam") || "90,70,120").split(",").map(Number);
const look = (p.get("look") || "0,5,0").split(",").map(Number);
const viewer = new GS.Viewer({
  cameraUp: [0, 1, 0],
  initialCameraPosition: cam,
  initialCameraLookAt: look,
  sharedMemoryForWorkers: false,
  gpuAcceleratedSort: false,
  selfDrivenMode: false,
});
viewer.addSplatScene(p.get("f") || "berlin.ply", { showLoadingUI: false, format: GS.SceneFormat.Ply })
  .then(() => {
    // Drive the viewer with a timer: requestAnimationFrame stalls in a hidden pane.
    setInterval(() => { viewer.update(); viewer.render(); }, 100);
    document.getElementById("log").textContent = "splats ok"; window.__splat = "ok";
  })
  .catch((e) => { document.getElementById("log").textContent = "ERROR " + e; window.__splat = String(e); });
</script>
</body>
</html>
